version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# TaxDesk PK — Local development infrastructure
# Start with: docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taxdesk-postgres
    restart: unless-stopped
    environment:
      # The superuser bootstraps the DB; init.sql creates taxdesk_migrations
      # and taxdesk_app from there. The application NEVER uses this superuser.
      POSTGRES_USER: taxdesk
      POSTGRES_PASSWORD: taxdesk_dev
      POSTGRES_DB: taxdesk_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxdesk -d taxdesk_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taxdesk-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible local storage) ─────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: taxdesk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taxdesk_minio
      MINIO_ROOT_PASSWORD: taxdesk_minio_dev
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MailHog (local email catching) ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: taxdesk-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres_data:
  redis_data:
  minio_data:
